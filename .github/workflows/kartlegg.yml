name: Kartlegg møteportaler

# Kjøres BARE manuelt (Actions -> Kartlegg møteportaler -> Run workflow).
# Tar 15-25 min for alle kommuner. Test gjerne med ANTALL=25 først.
on:
  workflow_dispatch:
    inputs:
      antall:
        description: 'Hvor mange kommuner? (0 = alle 357)'
        required: false
        default: '25'

permissions:
  contents: write

jobs:
  kartlegg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kjør speideren
        env:
          ANTALL: ${{ github.event.inputs.antall }}
        run: node kartlegg.js

      - name: Lagre portaler.json
        run: |
          git config user.name "signal-robot"
          git config user.email "actions@github.com"
          git add portaler.json
          git diff --staged --quiet || git commit -m "Kartla møteportaler $(date +%F)"
          git push
